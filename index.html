<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101219" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Virtus City es una ciudad virtual construida con los dibujos de su comunidad. Dibujá, publicá y mirá cómo tu imaginación forma parte de la ciudad."
    />

    <!-- Política de Seguridad de Contenido (CSP).
         Se recomienda enviarla como cabecera HTTP desde el servidor (ver public/_headers),
         que es más segura y no interfiere con los scripts de desarrollo.
         No se incluye aquí como meta porque Vite genera scripts en línea que una política
         estricta bloquearía. La definición para producción está en public/_headers. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Virtus City — Tu imaginación construye nuestra ciudad</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Virtus City necesita JavaScript activado para funcionar. Por favor, activalo para continuar.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
